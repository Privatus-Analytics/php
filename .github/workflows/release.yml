name: Release

# Packagist has no trusted publishing (OIDC). It reads new tags from GitHub
# through a webhook, so this workflow only tests the tag and makes a GitHub
# release. No Packagist token is stored here.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer validate --strict
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      - run: composer archive --format=zip --dir=build --file="privatus-analytics-${GITHUB_REF_NAME}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/privatus-analytics-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
